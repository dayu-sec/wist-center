name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  # 1. 按平台原生编译二进制，产出 tarball
  build-binaries:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cargo build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package tarball
        run: |
          mkdir -p artifacts
          cp "target/${{ matrix.target }}/release/wist-center" artifacts/wist-center
          tar -czf "wist-center-${{ github.ref_name }}-${{ matrix.target }}.tar.gz" -C artifacts wist-center

      - uses: actions/upload-artifact@v7
        with:
          name: wist-center-${{ matrix.target }}
          path: wist-center-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  # 2. 用 Linux 二进制构建并推送多架构镜像（ghcr.io + 腾讯云 TCR）
  docker:
    needs: [build-binaries]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: wist-center-*-linux-gnu
          path: staged
          merge-multiple: true

      - name: Stage binaries for docker build
        run: |
          mkdir -p docker/amd64 docker/arm64
          tar -xzf "staged/wist-center-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz" -C docker/amd64
          tar -xzf "staged/wist-center-${{ github.ref_name }}-aarch64-unknown-linux-gnu.tar.gz" -C docker/arm64
          ls -R docker/amd64 docker/arm64

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 国内镜像源（腾讯云 TCR）：国内服务器拉 ghcr.io 很慢，客户端改用 TCR 地址。
      # 凭据在 TCR 控制台生成（访问凭证），存 GitHub Secrets：TCR_USERNAME / TCR_PASSWORD。
      - name: Login to TCR
        uses: docker/login-action@v4
        with:
          registry: dy-sec.tencentcloudcr.com
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - name: Compute image tags
        id: meta
        run: |
          # 预发布 tag（v0.1.3-alpha / -beta / -rc …）只推该 tag，**不覆盖 :latest**：
          # 否则 :latest 会指向预发布产物。注意 on.push.tags 的 `v*.*.*` 也会匹配
          # `v0.1.3-alpha`，不能指望触发条件区分。两个源（ghcr / TCR）同进退。
          ghcr="ghcr.io/${{ github.repository }}"
          tcr="dy-sec.tencentcloudcr.com/cloud/wist-center"
          tags="$(printf '%s\n%s' "$ghcr:${{ github.ref_name }}" "$tcr:${{ github.ref_name }}")"
          case "${{ github.ref_name }}" in
            *-*)
              ;;
            *)
              tags="$(printf '%s\n%s' "$tags" "$ghcr:latest")"
              tags="$(printf '%s\n%s' "$tags" "$tcr:latest")"
              ;;
          esac
          printf 'tags<<__EOF__\n%s\n__EOF__\n' "$tags" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: docker
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          platforms: linux/amd64,linux/arm64

  # 3. 发布 tarball 到 GitHub Release
  release:
    needs: [build-binaries]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: wist-center-*
          path: artifacts
          merge-multiple: true

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: artifacts/*.tar.gz

# 注：本工作流产出二进制 tarball + 多架构容器镜像。
#   - tarball：三个平台的原生产物，挂到 GitHub Release（release job）。
#   - 镜像：`docker/` 作为构建上下文（其中的 Dockerfile + 流水线暂存的 amd64/ arm64
#     产物），双推 ghcr.io 与腾讯云 TCR（docker job）。需在仓库 Secrets 配置
#     TCR_USERNAME / TCR_PASSWORD。
# docker/initdb 是 PostgreSQL 的初始化脚本挂载目录（见 docker-compose.yml），
# 与镜像构建无关 —— Dockerfile 只 COPY ${TARGETARCH}/wist-center。
