name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  # 1. 按平台原生编译二进制，产出 tarball
  build-binaries:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cargo build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package tarball
        run: |
          mkdir -p artifacts
          cp "target/${{ matrix.target }}/release/wist-center" artifacts/wist-center
          tar -czf "wist-center-${{ github.ref_name }}-${{ matrix.target }}.tar.gz" -C artifacts wist-center

      - uses: actions/upload-artifact@v7
        with:
          name: wist-center-${{ matrix.target }}
          path: wist-center-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  # 2. 发布 tarball 到 GitHub Release
  release:
    needs: [build-binaries]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: wist-center-*
          path: artifacts
          merge-multiple: true

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: artifacts/*.tar.gz

# 注：本工作流只产出二进制 tarball。
# wist-center 目前没有容器镜像：本仓无 Dockerfile，`docker/` 是 PostgreSQL 的
# initdb 挂载目录（见 docker-compose.yml），不是镜像构建上下文；wist-gateway-stack
# 也未引用 center 镜像。若将来需要出镜像，先补 docker/Dockerfile（可参照
# wist-gateway 的「预编译二进制 + 最小运行时」写法），再恢复一个 docker job：
# 它需要用 actions/download-artifact 取回 linux-gnu 产物、按 TARGETARCH 暂存，
# 并以 packages: write 推送到 ghcr.io。
