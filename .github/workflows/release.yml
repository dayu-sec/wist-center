name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  # 1a. Linux 二进制（静态 musl）：镜像 job 只依赖这一段，不再等 macOS。
  build-linux:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux 出 **静态 musl**：制品被抽出到宿主原生运行，不能绑宿主 glibc 版本。
          # 原生 runner 构建：amd64 在 ubuntu-24.04，arm64 在 ubuntu-24.04-arm。
          - os: ubuntu-24.04
            arch: amd64
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            arch: arm64
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      # 按 target 分缓存：musl 的产物在 target/<triple>/ 下，和宿主 build 不互相污染。
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Cargo build
        # ring / rustls(aws-lc-rs) 等 C 依赖按 target 取 CC；Rust 侧链接器指向 musl-gcc 才能真静态。
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          AR_x86_64_unknown_linux_musl: ar
          CC_aarch64_unknown_linux_musl: musl-gcc
          AR_aarch64_unknown_linux_musl: ar
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package tarball
        run: |
          mkdir -p artifacts
          cp "target/${{ matrix.target }}/release/wist-center" artifacts/wist-center
          # 升级兼容声明随包走（中心/网关入库时读它：缺了只告警，有它才能在派发前拦住不兼容组合）。
          cp compat.json artifacts/compat.json
          tar -czf "wist-center-${{ github.ref_name }}-${{ matrix.target }}.tar.gz" -C artifacts wist-center compat.json

      - uses: actions/upload-artifact@v7
        with:
          name: wist-center-${{ matrix.target }}
          path: wist-center-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  # 1b. macOS 二进制：只 gate GitHub Release，不阻塞镜像构建。
  build-macos:
    name: Build aarch64-apple-darwin
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin

      # macOS 编译最慢且在关键路径上（release job 要等它），这里缓存收益最大。
      - uses: Swatinem/rust-cache@v2
        with:
          key: aarch64-apple-darwin

      - name: Cargo build
        run: cargo build --release --target aarch64-apple-darwin

      - name: Package tarball
        run: |
          mkdir -p artifacts
          cp "target/aarch64-apple-darwin/release/wist-center" artifacts/wist-center
          cp compat.json artifacts/compat.json
          tar -czf "wist-center-${{ github.ref_name }}-aarch64-apple-darwin.tar.gz" -C artifacts wist-center compat.json

      - uses: actions/upload-artifact@v7
        with:
          name: wist-center-aarch64-apple-darwin
          path: wist-center-${{ github.ref_name }}-aarch64-apple-darwin.tar.gz
          if-no-files-found: error
          retention-days: 7

  # 2a/2b. 原生分架构构建镜像，彻底去掉 QEMU：
  #   amd64 → ubuntu-24.04，arm64 → ubuntu-24.04-arm。
  #   **每个架构各推两次（ghcr / TCR），各自按 digest 落地**：buildx 的 `type=image` 不接受
  #   多个 `name=` + `push-by-digest`（实测只推最后一个），所以不能靠一次构建双推。
  #   manifest 阶段只在各自仓库内建 index —— 不做 ghcr → TCR 的跨仓库搬层
  #   （那条路径曾在 2026-11-01 卡死 30+ 分钟）。
  docker-amd64:
    name: Docker image (linux/amd64)
    needs: [build-linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: wist-center-x86_64-unknown-linux-musl
          path: staged

      - name: Stage binary for docker build
        run: |
          mkdir -p docker/amd64
          tar -xzf "staged/wist-center-${{ github.ref_name }}-x86_64-unknown-linux-musl.tar.gz" -C docker/amd64
          ls -R docker/amd64

      - uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 国内镜像源（腾讯云 TCR）：国内服务器拉 ghcr.io 很慢，客户端改用 TCR 地址。
      # 凭据在 TCR 控制台生成（访问凭证），存 GitHub Secrets：TCR_USERNAME / TCR_PASSWORD。
      - name: Login to TCR
        uses: docker/login-action@v4
        with:
          registry: dy-sec.tencentcloudcr.com
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - name: Build and push to ghcr by digest
        id: ghcr
        uses: docker/build-push-action@v7
        with:
          context: docker
          platforms: linux/amd64
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,push=true
          # 预编译二进制的镜像只剩 COPY；缓存仍能省掉基础层拉取。
          cache-from: type=gha,scope=center-amd64
          cache-to: type=gha,mode=max,scope=center-amd64

      - name: Build and push to TCR by digest
        id: tcr
        uses: docker/build-push-action@v7
        with:
          context: docker
          platforms: linux/amd64
          outputs: type=image,name=dy-sec.tencentcloudcr.com/cloud/wist-center,push-by-digest=true,push=true
          cache-from: type=gha,scope=center-amd64

      - name: Export digests
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          ghcr="${{ steps.ghcr.outputs.digest }}"
          tcr="${{ steps.tcr.outputs.digest }}"
          [ -n "${ghcr}" ] && [ -n "${tcr}" ] || { echo "::error::build-push 没有返回 digest"; exit 1; }
          printf '%s' "${ghcr#sha256:}" > /tmp/digests/ghcr-amd64
          printf '%s' "${tcr#sha256:}" > /tmp/digests/tcr-amd64

      - uses: actions/upload-artifact@v7
        with:
          name: digests-amd64
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-arm64:
    name: Docker image (linux/arm64)
    needs: [build-linux]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: wist-center-aarch64-unknown-linux-musl
          path: staged

      - name: Stage binary for docker build
        run: |
          mkdir -p docker/arm64
          tar -xzf "staged/wist-center-${{ github.ref_name }}-aarch64-unknown-linux-musl.tar.gz" -C docker/arm64
          ls -R docker/arm64

      - uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to TCR
        uses: docker/login-action@v4
        with:
          registry: dy-sec.tencentcloudcr.com
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - name: Build and push to ghcr by digest
        id: ghcr
        uses: docker/build-push-action@v7
        with:
          context: docker
          platforms: linux/arm64
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,push=true
          cache-from: type=gha,scope=center-arm64
          cache-to: type=gha,mode=max,scope=center-arm64

      - name: Build and push to TCR by digest
        id: tcr
        uses: docker/build-push-action@v7
        with:
          context: docker
          platforms: linux/arm64
          outputs: type=image,name=dy-sec.tencentcloudcr.com/cloud/wist-center,push-by-digest=true,push=true
          cache-from: type=gha,scope=center-arm64

      - name: Export digests
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          ghcr="${{ steps.ghcr.outputs.digest }}"
          tcr="${{ steps.tcr.outputs.digest }}"
          [ -n "${ghcr}" ] && [ -n "${tcr}" ] || { echo "::error::build-push 没有返回 digest"; exit 1; }
          printf '%s' "${ghcr#sha256:}" > /tmp/digests/ghcr-arm64
          printf '%s' "${tcr#sha256:}" > /tmp/digests/tcr-arm64

      - uses: actions/upload-artifact@v7
        with:
          name: digests-arm64
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # 2c. 合并两个架构的 digest → 多架构 manifest。
  #     **不跨仓库复制**：每个仓库用它**自己**的 per-arch digest 作源建 index（只写 manifest，不搬层）。
  #     本 job 卡住/失败时可单独补跑：见 compose-manifest.yml（workflow_dispatch，
  #     该文件也在默认分支上，否则无法手动派发）。
  docker-manifest:
    name: Compose multi-arch manifest
    needs: [docker-amd64, docker-arm64]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: digests-*
          path: /tmp/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to TCR
        uses: docker/login-action@v4
        with:
          registry: dy-sec.tencentcloudcr.com
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - name: Compute image tags
        id: meta
        run: |
          # 预发布 tag（v0.1.3-alpha / -beta / -rc …）只推该 tag，**不覆盖 :latest**：
          # 否则 :latest 会指向预发布产物。注意 on.push.tags 的 `v*.*.*` 也会匹配
          # `v0.1.3-alpha`，不能指望触发条件区分。两个源（ghcr / TCR）同进退。
          ghcr="ghcr.io/${{ github.repository }}"
          tcr="dy-sec.tencentcloudcr.com/cloud/wist-center"
          ghcr_tags="$ghcr:${{ github.ref_name }}"
          tcr_tags="$tcr:${{ github.ref_name }}"
          case "${{ github.ref_name }}" in
            *-*)
              ;;
            *)
              ghcr_tags="$(printf '%s\n%s' "$ghcr_tags" "$ghcr:latest")"
              tcr_tags="$(printf '%s\n%s' "$tcr_tags" "$tcr:latest")"
              ;;
          esac
          {
            printf 'ghcr_tags<<__EOF__\n%s\n__EOF__\n' "$ghcr_tags"
            printf 'tcr_tags<<__EOF__\n%s\n__EOF__\n' "$tcr_tags"
          } >> "$GITHUB_OUTPUT"

      # 前置检查：每个仓库的 per-arch digest 必须真在那里。缺一边就快速失败。
      - name: Verify per-arch digests
        run: |
          set -euo pipefail
          ghcr="ghcr.io/${{ github.repository }}"
          tcr="dy-sec.tencentcloudcr.com/cloud/wist-center"
          for f in /tmp/digests/ghcr-*; do
            digest="sha256:$(cat "$f")"
            docker buildx imagetools inspect "${ghcr}@${digest}" > /dev/null
            echo "ok ghcr ${digest}"
          done
          for f in /tmp/digests/tcr-*; do
            digest="sha256:$(cat "$f")"
            docker buildx imagetools inspect "${tcr}@${digest}" > /dev/null
            echo "ok tcr ${digest}"
          done
          [ "$(find /tmp/digests -name 'ghcr-*' | wc -l | tr -d ' ')" -eq 2 ] || { echo "::error::期望 2 个 ghcr digest"; exit 1; }
          [ "$(find /tmp/digests -name 'tcr-*' | wc -l | tr -d ' ')" -eq 2 ] || { echo "::error::期望 2 个 TCR digest"; exit 1; }

      - name: Create ghcr multi-arch manifest
        env:
          TAGS: ${{ steps.meta.outputs.ghcr_tags }}
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && args+=(-t "$tag")
          done <<< "$TAGS"
          sources=()
          for f in /tmp/digests/ghcr-*; do
            sources+=("ghcr.io/${{ github.repository }}@sha256:$(cat "$f")")
          done
          docker buildx imagetools create "${args[@]}" "${sources[@]}"
          while IFS= read -r tag; do
            [ -n "$tag" ] && docker buildx imagetools inspect "$tag"
          done <<< "$TAGS"

      - name: Create TCR multi-arch manifest
        env:
          TAGS: ${{ steps.meta.outputs.tcr_tags }}
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && args+=(-t "$tag")
          done <<< "$TAGS"
          sources=()
          for f in /tmp/digests/tcr-*; do
            sources+=("dy-sec.tencentcloudcr.com/cloud/wist-center@sha256:$(cat "$f")")
          done
          docker buildx imagetools create "${args[@]}" "${sources[@]}"
          while IFS= read -r tag; do
            [ -n "$tag" ] && docker buildx imagetools inspect "$tag"
          done <<< "$TAGS"

  # 3. 发布 tarball 到 GitHub Release
  release:
    needs: [build-linux, build-macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: wist-center-*
          path: artifacts
          merge-multiple: true

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: artifacts/*.tar.gz

# 注：本工作流产出二进制 tarball + 多架构容器镜像。
#   - tarball：三个平台的原生产物，挂到 GitHub Release（release job）。
#   - 镜像：**原生分架构**构建（amd64 在 ubuntu-24.04、arm64 在 ubuntu-24.04-arm），
#     各自把同一个 digest **直接推到 ghcr.io 与腾讯云 TCR 两个仓库**；docker-manifest 只在
#     每个仓库内建多架构 index（不跨仓库搬层）。**不使用 QEMU**：arm64 原生跑 Dockerfile，避免 apt 在
#     模拟器里耗时 10 分钟以上。需在仓库 Secrets 配置 TCR_USERNAME / TCR_PASSWORD。
# docker/initdb 是 PostgreSQL 的初始化脚本挂载目录（见 docker-compose.yml），
# 与镜像构建无关 —— Dockerfile 只 COPY ${TARGETARCH}/wist-center。

  # 可选：把本仓制品推到腾讯云 COS（对象存储），供中心 / CDN / 客户端按稳定 URL 拉取。
  # 未配置 Variables（COS_BUCKET 为空）时整段自动跳过，不会让发布失败；
  # 一旦设置 COS_BUCKET 即视为启用，此时密钥缺失会直接报错（便于发现漏配）。
  # 注意：`secrets` 上下文不能出现在 step 级 if 里，故启用判定放在 job 级（只看 vars）。
  #   Variables：COS_BUCKET（含 -APPID）、COS_REGION（如 ap-guangzhou）、可选 COS_PREFIX（默认取仓库名）
  #   Secrets：  COS_SECRET_ID、COS_SECRET_KEY（临时密钥再加 COS_SESSION_TOKEN）
  # 对象键：<COS_PREFIX>/<tag>/<文件名> 与 <COS_PREFIX>/latest/<文件名>
  # 每个对象带自定义元数据 x-cos-meta-artifact-sha256=<hex>（COS 只存 MD5 ETag，sha256 得自带）。
  upload-cos:
    name: Upload artifacts to Tencent COS
    needs: [release]
    runs-on: ubuntu-24.04
    if: ${{ vars.COS_BUCKET != '' }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: pkg
          merge-multiple: true

      - name: Install coscli
        run: |
          set -eu
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/coscli" \
            https://github.com/tencentyun/coscli/releases/download/v1.0.9/coscli-v1.0.9-linux-amd64
          chmod +x "$HOME/.local/bin/coscli"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/coscli" --version

      - name: Upload to COS
        env:
          COS_BUCKET: ${{ vars.COS_BUCKET }}
          COS_REGION: ${{ vars.COS_REGION }}
          COS_PREFIX: ${{ vars.COS_PREFIX }}
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_SESSION_TOKEN: ${{ secrets.COS_SESSION_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          # 去掉密钥里的空白字符：粘贴常带入尾随换行/空格，会让签名报 SecretKey is invalid。
          secret_id="$(printf '%s' "${COS_SECRET_ID}" | tr -d '[:space:]')"
          secret_key="$(printf '%s' "${COS_SECRET_KEY}" | tr -d '[:space:]')"
          session_token="$(printf '%s' "${COS_SESSION_TOKEN}" | tr -d '[:space:]')"
          # 明文写入 AK/SK，因此必须显式关掉 coscli 的密钥加密（disableencryption）。
          cat > "$HOME/.cos.yaml" <<EOF
          cos:
            base:
              protocol: https
              disableencryption: "true"
              secretid: "${secret_id}"
              secretkey: "${secret_key}"
              sessiontoken: "${session_token}"
            buckets:
              - name: "${COS_BUCKET}"
                alias: "${COS_BUCKET}"
                region: "${COS_REGION}"
                endpoint: "cos.${COS_REGION}.myqcloud.com"
          EOF
          prefix="${COS_PREFIX:-${GITHUB_REPOSITORY##*/}}"
          prefix="${prefix%/}"
          cfg="$HOME/.cos.yaml"
          out="$PWD/coscli_output"
          rm -rf "${out}"
          # coscli 只打印汇总，失败明细落在 coscli_output/<时间>/ 下；失败时打印并输出为 annotation。
          dump_err() {
            echo "::error::$1"
            if [ -d "${out}" ]; then
              find "${out}" -type f -exec sh -c 'echo "--- $1"; cat "$1"' _ {} \;
              detail="$(find "${out}" -type f -exec cat {} \; | tr '\n' ' ' | sed -e 's/%/%25/g' | cut -c1-1500)"
              echo "::error title=coscli 明细::$1 —— ${detail}"
            fi
            exit 1
          }
          shopt -s nullglob
          files=(pkg/*)
          [ ${#files[@]} -gt 0 ] || { echo "::error::pkg/ 下没有制品可上传"; exit 1; }
          for f in "${files[@]}"; do
            [ -f "${f}" ] || continue
            name="$(basename "${f}")"
            # COS 对象只存 MD5（ETag），GitHub 侧资产 digest（sha256）过不来。把 sha256 作为
            # **对象自定义元数据**写进对象本身（x-cos-meta-artifact-sha256 —— 与设计里的
            # artifact_sha256 字段同名）—— 随对象走，录 COS 地址时可用 `coscli stat`（HEAD）
            # 读回填 expected_sha256（`ls` 不返回自定义元数据）。--meta 形如 key:value（多个用 # 分隔）。
            # 本 step 只有 `set -eu`（无 pipefail），管道失败会被 cut 吃掉；空摘要等于又「丢」了，
            # 故显式兜一道。
            sha="$(sha256sum "${f}" | cut -d' ' -f1)"
            [ -n "${sha}" ] || { echo "::error::无法计算 ${name} 的 sha256" >&2; exit 1; }
            meta="x-cos-meta-artifact-sha256:${sha}"
            coscli cp "${f}" "cos://${COS_BUCKET}/${prefix}/${TAG}/${name}" -c "${cfg}" --meta "${meta}" \
              || dump_err "上传 ${name} 失败（${TAG}）"
            coscli cp "${f}" "cos://${COS_BUCKET}/${prefix}/latest/${name}" -c "${cfg}" --meta "${meta}" \
              || dump_err "上传 ${name} 失败（latest）"
            echo "已上传 ${name}  sha256=${sha}"
          done
          echo "COS 上传完成。"
          coscli ls "cos://${COS_BUCKET}/${prefix}/" -c "${cfg}" \
            || echo "::warning::COS 列表失败（可能缺 cos:GetBucket 权限）；上传本身已成功。"
