# @jumo generated
# @jumo hash=0000000000000000

[package]
name = "wist-center"
version = "0.4.0" #@gxl:set(version)
edition = "2024"

[dependencies]
jumo-derive =  "0.1"
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
serde_json = "1"
toml = "1.1"
ring = "0.17"
async-trait = "0.1"
aws-sdk-s3 = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres", "tls-none", "chrono"] }
wist-control =  "0.6"
wist-error =  "0.1"
wist-contracts = "0.2"

# 网关客户端证书（mTLS）签发：中心当 CA-G，按网关 CSR 签「每网关一张」客户端证书。
# 与网关侧 infra/agent_ca.rs 同口径（rcgen 签、x509-parser 读 URI SAN）。
rcgen = { version = "0.13", features = ["x509-parser"] }
x509-parser = "0.16"
time = { version = "0.3", features = ["std"] }

# 中心服务端 TLS/mTLS：服务器证书（CA-S）+ 校网关客户端证书（CA-G）。
# 与网关侧 infra/tls.rs 同构（WebPkiClientVerifier + allow_unauthenticated、握手后取客户端叶证书）。
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
rustls-pki-types = "1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
hyper = "1"
hyper-util = { version = "0.1", features = ["server-auto", "tokio", "service", "http1", "http2"] }

#wist-control = { path = "../wist-control" }
#wist-error = { path = "../wist-error" }
orion-error = { version = "0.8", features = ["derive", "serde_json"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
