# @jumo generated
# @jumo hash=0000000000000000

[package]
name = "wist-center"
version = "0.3.0" #@gxl:set(version)
edition = "2024"

[dependencies]
jumo-derive =  "0.1"
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
serde_json = "1"
toml = "1.1"
ring = "0.17"
async-trait = "0.1"
aws-sdk-s3 = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres", "tls-none", "chrono"] }
wist-control =  "0.6"
wist-error =  "0.1"
# 本地联调：gateway_control（网关注册/凭据契约）尚未发 crates.io，先用本地 path。
# 发布时按依赖序切回 `wist-contracts = "0.1"`。
wist-contracts = { path = "../wist-contracts" }

# 网关客户端证书（mTLS）签发：中心当 CA-G，按网关 CSR 签「每网关一张」客户端证书。
# 与网关侧 infra/agent_ca.rs 同口径（rcgen 签、x509-parser 读 URI SAN）。
rcgen = { version = "0.13", features = ["x509-parser"] }
x509-parser = "0.16"
time = { version = "0.3", features = ["std"] }

#wist-control = { path = "../wist-control" }
#wist-error = { path = "../wist-error" }
orion-error = { version = "0.8", features = ["derive", "serde_json"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
